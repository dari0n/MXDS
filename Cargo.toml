[package]
name = "mxds"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "MXDS — самостоятельный Windows-клиент обхода DPI на Rust (перенос zapret-discord-youtube)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["glow"] }
egui = "0.31"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Wdk_System_SystemServices",
] }
libloading = "0.8"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Цикл 14: panic = "unwind" (дефолт) — иначе не работает panic-hook
# GUI (Цикл 13) и изоляция паник диагностики.
strip = true
